[package]
name = "pragma_graph"
description = "pragma.core L3: per-frame task graph with declared resource access"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# The graph frame and its tasks in the puffin profiler (DECISIONS.md #29).
puffin = ["dep:puffin", "pragma_jobs/puffin"]

[dependencies]
pragma_base = { workspace = true }
pragma_jobs = { workspace = true }
pragma_sync = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
puffin = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }

[[bench]]
name = "graph"
harness = false

[lints]
workspace = true
