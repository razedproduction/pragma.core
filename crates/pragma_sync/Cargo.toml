[package]
name = "pragma_sync"
description = "pragma.core L1: low-level synchronization primitives (the only crate allowed to use unsafe)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
crossbeam-utils = { workspace = true }
thiserror = { workspace = true }

# Под `--cfg loom` библиотека сама импортирует модели loom (src/primitives.rs), поэтому это
# обычная зависимость; в сборках без флага она не активируется (DECISIONS.md #12).
[target.'cfg(loom)'.dependencies]
loom = { workspace = true }

[lints]
workspace = true
