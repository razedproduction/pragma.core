[package]
name = "pragma_jobs"
description = "pragma.core L2: work-stealing job system (pool, join, scope, parallel-for)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
# Области `scope`/`parallel_*` в профайлере кадра puffin (DECISIONS.md #29).
puffin = ["dep:puffin"]

[dependencies]
pragma_base = { workspace = true }
pragma_sync = { workspace = true }
pragma_sys = { workspace = true }
crossbeam-deque = { workspace = true }
thiserror = { workspace = true }
puffin = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
rayon = { workspace = true }

[[bench]]
name = "jobs"
harness = false

[lints]
workspace = true
