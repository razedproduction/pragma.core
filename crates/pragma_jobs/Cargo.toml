[package]
name = "pragma_jobs"
description = "pragma.core L2: work-stealing job system (pool, join, scope, parallel-for)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# `scope`/`parallel_*` regions in the puffin frame profiler (DECISIONS.md #29).
puffin = ["dep:puffin"]

[dependencies]
pragma_base = { workspace = true }
pragma_sync = { workspace = true }
pragma_sys = { workspace = true }
crossbeam-deque = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
puffin = { workspace = true, optional = true }

[dev-dependencies]
proptest = { workspace = true }
criterion = { workspace = true }
rayon = { workspace = true }

[[bench]]
name = "jobs"
harness = false

[lints]
workspace = true

# docs.rs documents every feature, including `puffin` (DECISIONS.md #47).
[package.metadata.docs.rs]
all-features = true
