# Слои workspace. Крейт может зависеть только от крейтов строго нижнего слоя.
# Исключения — в [allow], каждое с записью в DECISIONS.md.
# Проверяется: python tools/audit_workspace.py .

# Крейты, в которых разрешён unsafe (см. docs/reliability.md §3): pragma_sync — под Miri +
# loom, pragma_sys — только системные FFI (DECISIONS.md #27).
unsafe_allowed = ["pragma_sync", "pragma_sys"]

[crates]
pragma_base = 0   # ошибки, хэндлы, время/тики, логирование
pragma_sync = 1   # примитивы синхронизации (unsafe: стирание лайфтайма, контекст задачи)
pragma_sys = 1    # платформенный слой: имена/приоритеты потоков, affinity (unsafe: FFI)
pragma_jobs = 2   # пул потоков, work-stealing, join/scope/parallel-for
pragma_graph = 3  # граф задач кадра
pragma_async = 3  # async-задачи (I/O) поверх пула
pragma_core = 4   # фасад: re-export, prelude, feature-флаги
frame_sim = 5     # пример-вертикальный срез (examples/), только через фасад

[allow]

# Осознанно принятые исключения из правила «никакого C/C++» (DECISIONS.md #7).
[purity.accepted]
generator = "dev-only: loom (cfg(loom)) для модель-чекинга pragma_sync; в дерево пользователей не попадает"
alloca = "dev-only: criterion 0.8 (бенчи pragma_jobs и pragma_graph, DECISIONS.md #17, #21); в дерево пользователей не попадает"
