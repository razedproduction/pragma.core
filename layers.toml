# Workspace layers. A crate may depend only on crates of a strictly lower layer.
# Exceptions go into [allow], each with an entry in DECISIONS.md.
# Checked by: python tools/audit_workspace.py .

# Crates where unsafe is allowed (see docs/reliability.md §3): pragma_sync under Miri +
# loom, pragma_sys for system FFI only (DECISIONS.md #27).
unsafe_allowed = ["pragma_sync", "pragma_sys"]

[crates]
pragma_base = 0   # errors, handles, time/ticks, logging
pragma_sync = 1   # synchronization primitives (unsafe: lifetime erasure, task context)
pragma_sys = 1    # platform layer: thread names/priorities, affinity (unsafe: FFI)
pragma_jobs = 2   # thread pool, work-stealing, join/scope/parallel-for
pragma_graph = 3  # frame graph
pragma_async = 3  # async tasks (I/O) on top of the pool
pragma_core = 4   # facade: re-exports, prelude, feature flags
frame_sim = 5     # vertical-slice example (examples/), through the facade only

[allow]

# The `unsafe` budget (docs/reliability.md §3, docs/unsafe.md): the exact number of occurrences of the
# keyword in a file's code (blocks, `unsafe fn`/`impl`, `unsafe fn(..)` types) and the decisions that
# allowed them. Growth only with a new entry in DECISIONS.md (CI compares against the base revision).
[unsafe_budget]
"crates/pragma_sync/src/scope.rs" = { count = 9, decisions = [15] }
"crates/pragma_sync/src/join.rs" = { count = 9, decisions = [30] }
"crates/pragma_sync/src/label.rs" = { count = 3, decisions = [28] }
"crates/pragma_sys/src/windows.rs" = { count = 6, decisions = [27] }
"crates/pragma_sys/src/linux.rs" = { count = 9, decisions = [27] }
"crates/pragma_graph/tests/alloc.rs" = { count = 9, decisions = [19] }
"crates/pragma_base/tests/oom.rs" = { count = 7, decisions = [37] }

# Deliberately accepted exceptions to the "no C/C++" rule (DECISIONS.md #7).
[purity.accepted]
generator = "dev-only: loom (cfg(loom)) for model-checking pragma_sync; never reaches users' dependency trees"
alloca = "dev-only: criterion 0.8 (benches of pragma_jobs, pragma_graph and pragma_async, DECISIONS.md #17, #21, #31); never reaches users' dependency trees"
