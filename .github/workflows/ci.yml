name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Обычно 2–5 мин; зависший тест должен падать быстро, а не висеть 6 ч по умолчанию.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p pragma_core --no-default-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features
      # Обязательный набор детерминизма (M5): 5 сценариев (seed, число сущностей, тик
      # применения загрузки) на 1, 2 и N воркерах (N = ядра раннера − 1, без переподписки),
      # мгновенная и запаздывающая загрузка, idle_spin, PoolStats, watchdog, подписчик tracing.
      # Тот же набор в debug (watchdog активен) — тест frame_sim/tests/suite.rs выше.
      - run: cargo run -p frame_sim --release -- --suite --ticks 200
      # Watchdog есть только в debug: в release тот же тест проверяет, что предупреждений нет.
      - run: cargo test -p pragma_jobs --release --test watchdog

  features:
    name: cargo hack --each-feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      # Каждая фича фасада по отдельности (и без фич) собирается и проходит clippy.
      - run: cargo hack clippy --workspace --each-feature --no-dev-deps -- -D warnings

  fuzz:
    name: fuzz (graph build, 60 s)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # Отдельный workspace `fuzz/` (libFuzzer — C++, DECISIONS #20). Таргет — явно: готовый
      # бинарник cargo-fuzz собран под musl и по умолчанию берёт свою платформу, а ASan
      # несовместим со статической libc musl.
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu graph_build -- -max_total_time=60
        env:
          RUSTFLAGS: ""

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88 check --workspace --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: Purity, layers & unsafe budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show
      # Счётчик unsafe (layers.toml [unsafe_budget]): в PR рост бюджета сверяется с базовой
      # ревизией и требует новой записи DECISIONS.md.
      - name: audit
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git show "${{ github.event.pull_request.base.sha }}:layers.toml" > "$RUNNER_TEMP/base-layers.toml"
            python tools/audit_workspace.py . "--unsafe-baseline=$RUNNER_TEMP/base-layers.toml"
          else
            python tools/audit_workspace.py .
          fi

  semver:
    name: semver-checks (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # Baseline — main (DECISIONS #33): ломающее изменение публичного API без подъёма
      # минорной версии (0.x) роняет PR.
      - run: cargo semver-checks --workspace --baseline-rev ${{ github.event.pull_request.base.sha }}

  bench:
    name: bench gate (${{ matrix.os }})
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-gate
      # A/B вперемешку main ↔ PR на одном раннере (DECISIONS #34, docs/perf.md §6):
      # регрессия > 10% сверх сдвига эталона (rayon / последовательный код) роняет PR.
      - name: bench gate
        shell: bash
        run: |
          git worktree add --detach ../bench-base "${{ github.event.pull_request.base.sha }}"
          python tools/bench_gate.py --base ../bench-base --head . --rounds 3 --summary "$GITHUB_STEP_SUMMARY"

  miri:
    name: Miri (pragma_sync, pragma_jobs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri test -p pragma_sync
        env:
          RUSTFLAGS: ""
      # Пул из 1 воркера поверх всего unsafe pragma_sync (DECISIONS #38): Tree Borrows —
      # crossbeam-epoch нарушает экспериментальные Stacked Borrows; утечки — его глобальный
      # сборщик (static, освобождает мешки лениво), не память пула.
      - run: cargo +nightly miri test -p pragma_jobs --test miri
        env:
          RUSTFLAGS: ""
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-ignore-leaks

  loom:
    name: loom (pragma_sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Доктесты работают с реальными потоками вне loom::model, поэтому только lib и tests.
      - run: cargo test -p pragma_sync --release --lib --tests
        env:
          RUSTFLAGS: --cfg loom
