name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  # Does the PR touch anything besides Markdown and docs/? If not, the heavy jobs (fuzz,
  # Miri, semver-checks, bench gate) are skipped (DECISIONS #45). A skipped job counts as
  # passed for required checks, unlike a workflow-level `paths-ignore`, which never reports.
  # Pushes to main always run everything.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}")
          echo "$files"
          if echo "$files" | grep -qvE '(\.md$|^docs/)'; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    # Usually 2–5 min; a hung test must fail fast rather than hang for the default 6 h.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo clippy -p pragma_core --no-default-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps --all-features
      # The mandatory determinism suite (M5): 5 scenarios (seed, entity count, load apply
      # tick) on 1, 2 and N workers (N = runner cores − 1, no oversubscription),
      # instant and delayed load, idle_spin, PoolStats, watchdog, tracing subscriber.
      # The same suite in debug (watchdog active) is the frame_sim/tests/suite.rs test above.
      - run: cargo run -p frame_sim --release -- --suite --ticks 200
      # The watchdog exists only in debug: in release the same test checks that there are no warnings.
      - run: cargo test -p pragma_jobs --release --test watchdog

  features:
    name: cargo hack --each-feature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack
      # Every facade feature on its own (and no features) builds and passes clippy.
      - run: cargo hack clippy --workspace --each-feature --no-dev-deps -- -D warnings

  fuzz:
    name: fuzz (graph build, 60 s)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # A separate `fuzz/` workspace (libFuzzer is C++, DECISIONS #20). The target is explicit: the
      # prebuilt cargo-fuzz binary is built for musl and defaults to its own platform, while ASan
      # is incompatible with musl's static libc.
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu graph_build -- -max_total_time=60
        env:
          RUSTFLAGS: ""

  msrv:
    name: MSRV (1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install 1.88 --profile minimal
      - uses: Swatinem/rust-cache@v2
      - run: cargo +1.88 check --workspace --all-features

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  audit:
    name: Purity, layers & unsafe budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show
      # The unsafe counter (layers.toml [unsafe_budget]): in a PR, budget growth is checked against the
      # base revision and requires a new DECISIONS.md entry.
      - name: audit
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git show "${{ github.event.pull_request.base.sha }}:layers.toml" > "$RUNNER_TEMP/base-layers.toml"
            python tools/audit_workspace.py . "--unsafe-baseline=$RUNNER_TEMP/base-layers.toml"
          else
            python tools/audit_workspace.py .
          fi

  semver:
    name: semver-checks (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      # The baseline is main, not crates.io (DECISIONS #33, #47): a breaking public API change
      # without a major version bump fails the PR.
      - run: cargo semver-checks --workspace --baseline-rev ${{ github.event.pull_request.base.sha }}

  bench:
    name: bench gate (${{ matrix.os }})
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench-gate
      # Interleaved A/B of main ↔ PR on one runner (DECISIONS #34, docs/perf.md §6):
      # a regression > 10% beyond the reference shift (rayon / sequential code) fails the PR.
      - name: bench gate
        shell: bash
        run: |
          git worktree add --detach ../bench-base "${{ github.event.pull_request.base.sha }}"
          python tools/bench_gate.py --base ../bench-base --head . --rounds 3 --summary "$GITHUB_STEP_SUMMARY"

  miri:
    name: Miri (pragma_sync, pragma_jobs)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal --component miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri test -p pragma_sync
        env:
          RUSTFLAGS: ""
      # A 1-worker pool over all of pragma_sync's unsafe (DECISIONS #38): Tree Borrows, because
      # crossbeam-epoch violates the experimental Stacked Borrows; the leaks are its global
      # collector (static, frees bags lazily), not pool memory.
      - run: cargo +nightly miri test -p pragma_jobs --test miri
        env:
          RUSTFLAGS: ""
          MIRIFLAGS: -Zmiri-tree-borrows -Zmiri-ignore-leaks

  loom:
    name: loom (pragma_sync)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      # Doctests use real threads outside loom::model, hence only lib and tests.
      - run: cargo test -p pragma_sync --release --lib --tests
        env:
          RUSTFLAGS: --cfg loom
