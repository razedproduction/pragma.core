name: Nightly

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Soak: stress tests 5 times longer; the seed of random panics/cancellations changes every night
  # (printed in the log for reproduction).
  PRAGMA_SOAK_ROUNDS: "5"
  PRAGMA_SOAK_SEED: ${{ github.run_number }}

jobs:
  stress:
    name: Stress / soak (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: rustup show # installs the toolchain pinned in rust-toolchain.toml
      - uses: Swatinem/rust-cache@v2
      # Long #[ignore] tests: 10^7 tasks, random panics, 1..2N workers.
      - run: cargo test -p pragma_jobs --release --test stress -- --ignored
      # Async: 200k tasks with random cancellation, panics and blocking calls, 1..2N workers.
      - run: cargo test -p pragma_async --release --test prop -- --ignored
      # frame_sim over many ticks: the whole determinism suite, 3000 ticks per run.
      - run: cargo run -p frame_sim --release -- --suite --ticks 3000

  fuzz:
    name: fuzz (graph build, 30 min)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      # The corpus survives across nights: restore the latest one and save the extended one under a new
      # key (caches are immutable).
      - uses: actions/cache@v4
        with:
          path: fuzz/corpus/graph_build
          key: fuzz-corpus-graph_build-${{ github.run_id }}
          restore-keys: fuzz-corpus-graph_build-
      - run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu graph_build -- -max_total_time=1800
        env:
          RUSTFLAGS: ""
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
